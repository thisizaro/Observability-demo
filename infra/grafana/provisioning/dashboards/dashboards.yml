# This tells Grafana "load any .json dashboard file found in this
# folder," and re-scan it every 10s so new/changed dashboards show up
# without restarting the container.
apiVersion: 1

providers:
  - name: 'Observability Demo Dashboards'
    orgId: 1
    folder: ''
    type: file
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
